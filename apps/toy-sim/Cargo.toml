[package]
name = "toy-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.104"
bevy.workspace = true

bevy_asset_loader = "0.27.0"
bevy_egui.workspace = true
hifitime = "4.3.1"
ordered-float = "5.5.0"

rand = "0.10.2"
rand_chacha = "0.10.0"
rayon = "1.12.0"
parry3d-f64.workspace = true
toy-sim-space = { path = "../../crates/toy-sim-space" }
toy-sim-stars = { path = "../../crates/toy-sim-stars" }
serde = { version = "1.0.229", features = ["derive"] }
serde_yml = "0.0.13"
smol_str = { version = "0.3.6", features = ["serde"] }
toml = "1.1.5"

toy-sim-ships = { path = "../../crates/toy-sim-ships" }
toy-sim-ship-api = { path = "../../crates/toy-sim-ship-api" }
toy-sim-ship-wasm = { path = "../../crates/toy-sim-ship-wasm" }
toy-sim-ship-view = { path = "../../crates/toy-sim-ship-view" }

# Linked explicitly only in debug builds; keep release binaries independent of Bevy's dylib.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_dylib.workspace = true

[dev-dependencies]
wat = "1.254.0"
toy-sim-example-controller = { path = "../../crates/toy-sim-example-controller" }
