[package]
name = "osg-ship-wasm"
version.workspace = true
edition.workspace = true

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }

osg-model = { path = "../osg-model" }
anyhow.workspace = true
wasmtime = { workspace = true, features = ["async"] }
wasmparser = "0.254.0"
wasm-encoder = { version = "0.254.0", features = ["wasmparser"] }
osg-ship-api = { path = "../osg-ship-api" }
osg-ships = { path = "../osg-ships" }
[dev-dependencies]
osg-universe = { path = "../osg-universe" }
glam = "0.32.1"
wat = "1.254.0"
