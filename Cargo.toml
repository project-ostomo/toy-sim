[workspace]
members = ["crates/*"]
default-members = ["."]
resolver = "3"

[package]
name = "toy-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.104"
bevy = { version = "0.19.1", features = [
    "wayland",
    "file_watcher",
    "embedded_watcher",
    "jpeg",
] }

bevy_asset_loader = "0.27.0"
bevy_egui = "0.42.0"
half = "2.7.1"
hifitime = "4.3.1"
ordered-float = "5.5.0"

rand = "0.10.2"
rand_chacha = "0.10.0"
rayon = "1.12.0"
toy-sim-space = { path = "crates/toy-sim-space" }
toy-sim-stars = { path = "crates/toy-sim-stars" }
serde = { version = "1.0.229", features = ["derive"] }
serde_yml = "0.0.13"
smol_str = { version = "0.3.6", features = ["serde"] }
toml = "1.1.5"

# Linked explicitly only in debug builds; keep release binaries independent of Bevy's dylib.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_dylib = "0.19.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
