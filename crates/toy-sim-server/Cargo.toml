[package]
name = "toy-sim-server"
version.workspace = true
edition.workspace = true

[features]
profile = ["bevy/trace_chrome"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded", "bevy_state", "bevy_asset", "bevy_log", "serialize"] }
parry3d-f64.workspace = true
rayon = "1.12"
ahash = "0.8"
ordered-float = "5.5"
hifitime = "4.3.1"
smol_str = { version = "0.3.6", features = ["serde"] }
rand_chacha = "0.10"
blake3 = "1.8"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toy-sim-intel = { path = "../toy-sim-intel" }
toy-sim-space = { path = "../toy-sim-space" }
toy-sim-spatial = { path = "../toy-sim-spatial" }
toy-sim-ship-api = { path = "../toy-sim-ship-api" }
toy-sim-ship-wasm = { path = "../toy-sim-ship-wasm" }
postcard = { version = "1.1", features = ["use-std"] }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
toy-sim-model = { path = "../toy-sim-model" }
toy-sim-net = { path = "../toy-sim-net" }
toy-sim-protocol = { path = "../toy-sim-protocol" }
toy-sim-ships = { path = "../toy-sim-ships" }
toy-sim-universe = { path = "../toy-sim-universe" }
tokio = { version = "1.53", features = ["full"] }
ed25519-dalek = "2.2"

[dev-dependencies]
toy-sim-example-controller = { path = "../toy-sim-example-controller" }
wat = "1.0"
toy-sim-client = { path = "../toy-sim-client" }

[dependencies.rand]
version = "0.10"

[dev-dependencies.zstd]
version = "0.13.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_dylib.workspace = true
