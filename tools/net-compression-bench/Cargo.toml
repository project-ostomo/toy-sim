[package]
name = "osg-net-compression-bench"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
postcard = { version = "=1.1.3", features = ["alloc"] }
libc = "0.2"
ciborium = "=0.2.2"
lz4 = "=1.28.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "0.11"
zstd = "=0.13.3"

[profile.release]
opt-level = 3
