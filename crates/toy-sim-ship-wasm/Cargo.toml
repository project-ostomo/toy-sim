[package]
name = "toy-sim-ship-wasm"
version.workspace = true
edition.workspace = true

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }

toy-sim-model = { path = "../toy-sim-model" }
anyhow.workspace = true
wasmtime = { workspace = true, features = ["async"] }
wasmparser = "0.254.0"
wasm-encoder = { version = "0.254.0", features = ["wasmparser"] }
toy-sim-ship-api = { path = "../toy-sim-ship-api" }
toy-sim-ships = { path = "../toy-sim-ships" }
[dev-dependencies]
toy-sim-universe = { path = "../toy-sim-universe" }
glam = "0.32.1"
wat = "1.254.0"
